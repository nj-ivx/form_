<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feras Company | Patient Registration</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabaseClient.js"></script>

    <style>
        :root {
            --bg-main: #f8fafc;
            --bg-surface: #ffffff;
            --bg-nav: rgba(255, 255, 255, 0.8);
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --brand-color: #2563eb;
            --border-color: #e2e8f0;
            --input-bg: #ffffff;
            --input-focus-ring: rgba(37, 99, 235, 0.2);
            --success-bg: #dcfce7;
            --success-text: #166534;
            --card-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            --transition-speed: 0.3s;
        }
        body.dark-mode {
            --bg-main: #0f172a;
            --bg-surface: #1e293b;
            --bg-nav: rgba(30, 41, 59, 0.8);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --brand-color: #3b82f6;
            --border-color: #334155;
            --input-bg: #0f172a;
            --input-focus-ring: rgba(59, 130, 246, 0.25);
            --success-bg: #064e3b;
            --success-text: #a7f3d0;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-primary); transition: all var(--transition-speed); }
        
        nav { position: fixed; top: 0; width: 100%; background: var(--bg-nav); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border-color); z-index: 1000; padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; }
        .nav-left { display: flex; align-items: center; gap: 20px; }
        .back-link { text-decoration: none; color: var(--text-secondary); font-size: 14px; font-weight: 600; display: flex; gap: 5px; }
        .logo { font-size: 20px; font-weight: 800; border-left: 1px solid var(--border-color); padding-left: 20px; }
        .theme-switch { background: var(--bg-surface); border: 1px solid var(--border-color); color: var(--text-primary); padding: 8px 16px; border-radius: 20px; font-size: 14px; font-weight: 600; cursor: pointer; display: flex; gap: 8px; }
        
        .container { max-width: 850px; margin: 100px auto 60px; padding: 0 20px; }
        .header { margin-bottom: 40px; }
        .header h1 { font-size: 32px; font-weight: 800; margin-bottom: 8px; }
        .header p { color: var(--text-secondary); }
        .form-section { background: var(--bg-surface); padding: 35px; border-radius: 16px; border: 1px solid var(--border-color); box-shadow: var(--card-shadow); margin-bottom: 30px; }
        .section-title { font-size: 18px; color: var(--brand-color); margin-bottom: 25px; }
        
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .form-group { display: flex; flex-direction: column; }
        .full-width { grid-column: span 2; }
        label { font-weight: 600; margin-bottom: 8px; font-size: 14px; }
        input, select, textarea { width: 100%; border-radius: 8px; border: 1px solid var(--border-color); background-color: var(--input-bg); color: var(--text-primary); font-size: 15px; padding: 12px 16px; outline: none; }
        input:focus, select:focus, textarea:focus { border-color: var(--brand-color); box-shadow: 0 0 0 4px var(--input-focus-ring); }
        textarea { resize: vertical; min-height: 100px; }
        
        .btn-submit { width: 100%; padding: 16px; border-radius: 10px; border: none; background-color: var(--brand-color); color: white; font-size: 16px; font-weight: 600; cursor: pointer; }
        #success-message { display: none; background-color: var(--success-bg); color: var(--success-text); padding: 20px; border-radius: 10px; text-align: center; font-weight: 600; margin-top: 30px; }
        #error-message { display: none; background-color: #fee2e2; color: #991b1b; padding: 20px; border-radius: 10px; text-align: center; font-weight: 600; margin-top: 30px; }
    </style>
</head>
<body>

    <nav>
        <div class="nav-left">
            <a href="index.html" class="back-link">← <span>Home</span></a>
            <div class="logo">Feras Company</div>
        </div>
        <button type="button" id="themeToggle" class="theme-switch">
            <span id="themeIcon">🌙</span> <span id="themeText">Dark</span>
        </button>
    </nav>

    <div class="container" id="main-content" style="display: none;">
        <div class="header">
            <h1>Patient Registration Form</h1>
            <p>Please fill out the confidential medical details below.</p>
        </div>

        <form id="patientForm">
            <!-- Section 1: Personal Information -->
            <div class="form-section">
                <h2 class="section-title">01. Personal Information</h2>
                <div class="form-grid">
                    <div class="form-group"><label>First Name</label><input type="text" name="firstName" required></div>
                    <div class="form-group"><label>Last Name</label><input type="text" name="lastName" required></div>
                    <div class="form-group"><label>Date of Birth</label><input type="date" name="dob" required></div>
                    <div class="form-group">
                        <label>Gender</label>
                        <select name="gender" required>
                            <option value="">Select...</option>
                            <option value="male">Male</option>
                            <option value="female">Female</option>
                        </select>
                    </div>
                    <div class="form-group"><label>Phone Number</label><input type="tel" name="phone" required></div>
                    <div class="form-group"><label>Email Address</label><input type="email" name="email"></div>
                    <div class="form-group full-width"><label>Home Address</label><input type="text" name="address" required></div>
                </div>
            </div>

            <!-- Section 2: Medical History -->
            <div class="form-section">
                <h2 class="section-title">02. Medical History</h2>
                <div class="form-grid">
                    <div class="form-group">
                        <label>Blood Type</label>
                        <select name="bloodType">
                            <option value="">Unknown</option>
                            <option value="A+">A+</option><option value="A-">A-</option>
                            <option value="B+">B+</option><option value="B-">B-</option>
                            <option value="O+">O+</option><option value="O-">O-</option>
                        </select>
                    </div>
                    <div class="form-group"><label>Weight (kg)</label><input type="number" name="weight" step="0.1"></div>
                    <div class="form-group full-width"><label>Known Allergies</label><textarea name="allergies"></textarea></div>
                    <div class="form-group full-width"><label>Current Medications</label><textarea name="medications"></textarea></div>
                    <div class="form-group full-width"><label>Chronic Conditions</label><textarea name="conditions"></textarea></div>
                </div>
            </div>

            <!-- Section 3: Insurance -->
            <div class="form-section">
                <h2 class="section-title">03. Insurance Information</h2>
                <div class="form-grid">
                    <div class="form-group"><label>Insurance Provider</label><input type="text" name="insuranceProvider"></div>
                    <div class="form-group"><label>Policy / ID Number</label><input type="text" name="policyNumber"></div>
                </div>
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">Securely Submit Record</button>
        </form>

        <div id="success-message">✓ Success! Patient information saved securely to the database.</div>
        <div id="error-message"></div>
    </div>

    <script>
        async function checkAuth() {
            const { data: { session } } = await window.supabaseApp.auth.getSession();
            if (!session) {
                window.location.href = 'auth.html';
            } else {
                document.getElementById('main-content').style.display = 'block';
            }
        }
        checkAuth();

        document.getElementById('patientForm').addEventListener('submit', async function(e) {
            e.preventDefault(); 
            
            const btn = document.getElementById('submitBtn');
            btn.innerText = 'Saving...';
            btn.disabled = true;
            document.getElementById('error-message').style.display = 'none';
            
            const formData = new FormData(this);
            
            const patientData = {
                first_name: formData.get('firstName'),
                last_name: formData.get('lastName'),
                dob: formData.get('dob'),
                gender: formData.get('gender'),
                phone: formData.get('phone'),
                email: formData.get('email'),
                address: formData.get('address'),
                blood_type: formData.get('bloodType'),
                weight: formData.get('weight') ? parseFloat(formData.get('weight')) : null,
                allergies: formData.get('allergies'),
                medications: formData.get('medications'),
                conditions: formData.get('conditions'),
                insurance_provider: formData.get('insuranceProvider'),
                policy_number: formData.get('policyNumber')
            };

            const { error } = await window.supabaseApp.from('patients').insert([patientData]);

            if (error) {
                const errorDiv = document.getElementById('error-message');
                errorDiv.innerText = 'Database Error: ' + error.message;
                errorDiv.style.display = 'block';
            } else {
                document.getElementById('success-message').style.display = 'block';
                this.reset();
                setTimeout(() => document.getElementById('success-message').style.display = 'none', 5000);
            }
            
            btn.innerText = 'Securely Submit Record';
            btn.disabled = false;
        });

        if (localStorage.getItem('theme') === 'dark') document.body.classList.add('dark-mode');
        document.getElementById('themeToggle').addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            localStorage.setItem('theme', document.body.classList.contains('dark-mode') ? 'dark' : 'light');
        });
    </script>
    
    <!-- Chatbase AI Integration -->
    <script>
        (function(){if(!window.chatbase||window.chatbase("getState")!=="initialized"){window.chatbase=(...arguments)=>{if(!window.chatbase.q){window.chatbase.q=[]}window.chatbase.q.push(arguments)};window.chatbase=new Proxy(window.chatbase,{get(target,prop){if(prop==="q"){return target.q}return(...args)=>target(prop,...args)}})}const onLoad=function(){const script=document.createElement("script");script.src="https://www.chatbase.co/embed.min.js";script.id="Ie42z57d6pT_nwLvZF5c7";script.domain="www.chatbase.co";document.body.appendChild(script)};if(document.readyState==="complete"){onLoad()}else{window.addEventListener("load",onLoad)}})();
    </script>
</body>
</html>
